<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <!-- Outer border card -->
  <rect x="2" y="2" width="416" height="156" rx="4" fill="#FFFFFF" stroke="#003893" stroke-width="2.5" />

  <!-- Top Blue Box (Left) -->
  <rect x="6" y="6" width="138" height="114" rx="6" fill="#003893" />

  <!-- White Pill/Capsule inside Blue Box -->
  <rect x="33" y="16" width="84" height="94" rx="42" fill="none" stroke="#FFFFFF" stroke-width="4.5" />

  <!-- Yogakshema Emblem: Flame & Diya Lamp (Center) -->
  <g id="diya-lamp">
    <!-- Flame of Life -->
    <path d="M75 42 C79 49 82 54 82 59 C82 63.5 78.8 66 75 66 C71.2 66 68 63.5 68 59 C68 54 71 49 75 42 Z" fill="#FFFFFF" />
    <!-- Diya Bowl -->
    <path d="M66 66 C66 70.5 70.5 72.5 75 72.5 C79.5 72.5 84 70.5 84 66 Z" fill="#FFFFFF" />
    <!-- Diya Base Stem -->
    <path d="M72 72.5 L78 72.5 L76.5 75.5 L73.5 75.5 Z" fill="#FFFFFF" />
  </g>

  <!-- Left Cupped Hand -->
  <g id="left-hand">
    <!-- Hand Palm & Fingers -->
    <path d="M47 52 C48 48 50 45 53 44 C54.2 43.8 55 44.5 54.8 46 C54.2 49 53.5 52 54.5 55.5 C55.5 58.5 58.5 62 62 64 C63.2 64.5 63.8 65.8 62.8 66.8 C59 69 54 68 50.5 65 C47 62 45.8 58 47 52 Z" fill="#FFFFFF" />
    <!-- Finger Ridges -->
    <path d="M51 45 C52.5 49 53 54 51.5 58" fill="none" stroke="#003893" stroke-width="1.2" stroke-linecap="round" />
    <path d="M53.5 47 C55 51 55.5 55 54 59" fill="none" stroke="#003893" stroke-width="1.2" stroke-linecap="round" />
    <path d="M56.5 49 C57.8 52.5 58 56 57 59.5" fill="none" stroke="#003893" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Right Cupped Hand (Symmetrical Mirror) -->
  <g transform="translate(150, 0) scale(-1, 1)">
    <path d="M47 52 C48 48 50 45 53 44 C54.2 43.8 55 44.5 54.8 46 C54.2 49 53.5 52 54.5 55.5 C55.5 58.5 58.5 62 62 64 C63.2 64.5 63.8 65.8 62.8 66.8 C59 69 54 68 50.5 65 C47 62 45.8 58 47 52 Z" fill="#FFFFFF" />
    <path d="M51 45 C52.5 49 53 54 51.5 58" fill="none" stroke="#003893" stroke-width="1.2" stroke-linecap="round" />
    <path d="M53.5 47 C55 51 55.5 55 54 59" fill="none" stroke="#003893" stroke-width="1.2" stroke-linecap="round" />
    <path d="M56.5 49 C57.8 52.5 58 56 57 59.5" fill="none" stroke="#003893" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Top Yellow Box (Right) -->
  <rect x="146" y="6" width="268" height="114" fill="#FFBA00" />

  <!-- Bold Blue "L I C" Typography -->
  <!-- L -->
  <path d="M172 26 L187 26 L187 88 L232 88 L232 101 L172 101 Z" fill="#003893" />
  <!-- I -->
  <rect x="248" y="26" width="15" height="75" fill="#003893" />
  <!-- C -->
  <path d="M374 38.5 C364 29 350 24 332 24 C299 24 278 47 278 63.5 C278 80 299 103 332 103 C350 103 364 98 374 88.5 L363 77.5 C355 85 344 89 332 89 C310 89 295 74 295 63.5 C295 53 310 38 332 38 C344 38 355 42 363 49.5 Z" fill="#003893" />

  <!-- Bottom Divider Line -->
  <line x1="2" y1="123" x2="418" y2="123" stroke="#003893" stroke-width="2" />

  <!-- Bottom Text: LIFE INSURANCE CORPORATION OF INDIA -->
  <text x="210" y="146" font-family="'Inter', 'Helvetica Neue', 'Arial', sans-serif" font-size="16" font-weight="800" fill="#003893" text-anchor="middle" letter-spacing="1.2">
    LIFE INSURANCE CORPORATION OF INDIA
  </text>
</svg>