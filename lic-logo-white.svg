<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <!-- Deep corporate blue gradient -->
    <linearGradient id="w_licBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4A96" />
      <stop offset="100%" stop-color="#042352" />
    </linearGradient>

    <!-- Rich Indian Saffron / Gold gradient -->
    <linearGradient id="w_licGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Warm Flame gradient -->
    <linearGradient id="w_licFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <filter id="w_softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Official LIC Insignia / Emblem -->
  <g transform="translate(10, 8)">
    <!-- Outer Shield/Circle -->
    <circle cx="52" cy="52" r="50" fill="url(#w_licBlueGrad)" stroke="url(#w_licGoldGrad)" stroke-width="3" />
    <circle cx="52" cy="52" r="45" fill="none" stroke="#FDE047" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Sanskrit Motto Arch: योगक्षेमं वहाम्यहम् -->
    <path id="w_mottoArc" d="M 18 52 A 34 34 0 0 1 86 52" fill="none" stroke="none" />
    <text font-family="'Noto Sans Devanagari', 'Inter', sans-serif" font-size="7.5" font-weight="700" fill="#FDE047" letter-spacing="1.2">
      <textPath href="#w_mottoArc" startOffset="50%" text-anchor="middle">
        योगक्षेमं वहाम्यहम्
      </textPath>
    </text>

    <!-- Flame of Life (Diya flame) -->
    <g filter="url(#w_softGlow)">
      <path d="M52 26 C56 31 59 35.5 59 40 C59 44 55.8 46.5 52 46.5 C48.2 46.5 45 44 45 40 C45 35.5 48 31 52 26 Z" fill="url(#w_licFlame)" />
      <path d="M52 30 C54 33.5 56 36.5 56 39.5 C56 41.5 54.2 43 52 43 C49.8 43 48 41.5 48 39.5 C48 36.5 50 33.5 52 30 Z" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Diya / Lamp base -->
    <path d="M44 46.5 C44 49.5 47.5 51 52 51 C56.5 51 60 46.5 60 46.5 C60 46.5 57 48 52 48 C47 48 44 46.5 44 46.5 Z" fill="url(#w_licGoldGrad)" />
    <path d="M49 51 L55 51 L53.5 53.5 L50.5 53.5 Z" fill="url(#w_licGoldGrad)" />

    <!-- Sheltering Protective Hands (Left & Right) -->
    <!-- Left Hand -->
    <path d="M29 55 C29.5 49 33 45 37 43 C38.2 42.5 39.5 43.2 39.2 44.5 C38.2 48 37 51 38.5 54.5 C39.8 57.5 44 60.5 48 62 C49.2 62.5 49.8 63.8 48.8 64.8 C45 66.5 40 65 35.5 62.5 C31 60 28.8 57 29 55 Z" fill="url(#w_licGoldGrad)" />
    <!-- Left Hand Thumb accent -->
    <path d="M39.5 44 C40.8 46 41.5 48.5 41 50.5 C40.2 49 39.5 47 39 45 Z" fill="#FDE047" />

    <!-- Right Hand -->
    <path d="M75 55 C74.5 49 71 45 67 43 C65.8 42.5 64.5 43.2 64.8 44.5 C65.8 48 67 51 65.5 54.5 C64.2 57.5 60 60.5 56 62 C54.8 62.5 54.2 63.8 55.2 64.8 C59 66.5 64 65 68.5 62.5 C73 60 75.2 57 75 55 Z" fill="url(#w_licGoldGrad)" />
    <!-- Right Hand Thumb accent -->
    <path d="M64.5 44 C63.2 46 62.5 48.5 63 50.5 C63.8 49 64.5 47 65 45 Z" fill="#FDE047" />

    <!-- Foundation Base Arch -->
    <path d="M36 68 C42 72 62 72 68 68 C64 70.5 40 70.5 36 68 Z" fill="url(#w_licGoldGrad)" opacity="0.8" />

    <!-- Bottom Bold LIC text inside emblem -->
    <rect x="36" y="74" width="32" height="15" rx="3" fill="#021C42" stroke="url(#w_licGoldGrad)" stroke-width="1" />
    <text x="52" y="85" font-family="'Inter', 'Arial Black', sans-serif" font-size="10" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="2">LIC</text>
  </g>

  <!-- Right: Typography Lockup (White + Gold for Dark Backgrounds) -->
  <!-- Top: Hindi / Devanagari Name -->
  <text x="130" y="42" font-family="'Noto Sans Devanagari', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    भारतीय जीवन बीमा निगम
  </text>

  <!-- Decorative Separator Line -->
  <line x1="130" y1="52" x2="520" y2="52" stroke="url(#w_licGoldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Bottom: English Name -->
  <text x="130" y="76" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="17" font-weight="800" fill="#FDE047" letter-spacing="1">
    LIFE INSURANCE CORPORATION OF INDIA
  </text>

  <!-- Subtitle Tag: Product Manufacturer & Insurer -->
  <g transform="translate(130, 88)">
    <rect x="0" y="0" width="310" height="20" rx="4" fill="#D97706" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1" />
    <text x="10" y="14" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" fill="#FDE047" letter-spacing="1">
      PRODUCT MANUFACTURER &amp; UNDERWRITER
    </text>
    <text x="325" y="14" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#93C5FD" letter-spacing="0.5">
      (Govt. of India Undertaking)
    </text>
  </g>
</svg>
